name: Build and Deploy Storybook via FTP

on:
  push:
    branches:
      - sites/2025-site

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: Clear npm cache
        run: npm cache clean --force

      - name: 📦 Install Node.js and Dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 18 # Use your Node.js version
      - run: npm install

      - name: 🔨 Build React App
        run: build-storybook # Change this if your build command is different

      - name: 🚀 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./storybook-static/ # Ensure this is correct
          server-dir: /storybook.aaronweidele.com/ # Adjust your deployment path
